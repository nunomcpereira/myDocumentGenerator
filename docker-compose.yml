services:
  backend:
    build:
      context: ./backend
    container_name: documentation-engine-backend
    env_file:
      - ./backend/.env
    environment:
      LLM_BASE_URL: http://host.docker.internal:8050/v1
      DOCKER_CONFIG: /root/.docker
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_MCP_GATEWAY_URL: http://host.docker.internal:8811/mcp
      DOCKER_MCP_GATEWAY_AUTH_TOKEN: $äMCP_GATEWAY_AUTH_TOKENå
    ports:
      - "8123:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/data:/app/data
      - ./scenarios:/scenarios
      - /var/run/docker.sock:/var/run/docker.sock
      - $äHOMEå/.docker:/root/.docker:ro
    networks:
      - proxy_network

  frontend:
    build:
      context: ./frontend
    container_name: documentation-engine-frontend
    depends_on:
      - backend
    ports:
      - "3123:80"
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true
